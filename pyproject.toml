[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-harness-stage1"
version = "0.1.0"
description = "Agent Security Harness Stage 1 architecture validation"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pydantic>=2.9", "uvicorn>=0.30"]

[project.scripts]
security-harness = "security_harness.main:main"
mock-agent = "tools.mock_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
